<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 557" role="img" aria-labelledby="chart-title chart-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="chart-title">One pipeline flow at 1.25 batches per second</title>
<desc id="chart-desc">Three panels of horizontal bars on a shared log scale. DuckLake, Aurora provisioned: write one batch (median) 94 ms, close a trace (slowest) 82 ms, read one trace back (median) 349 ms. DuckLake, Aurora Serverless v2: write one batch (median) 96 ms, close a trace (slowest) 87 ms, read one trace back (median) 340 ms. Iceberg per batch, S3 Tables: write one batch (median) 6.1 s, close a trace (slowest) 27 s, read one trace back (median) 2.2 s, fell behind schedule at 1.13 batches per second. Iceberg per trace, S3 Tables: write one batch (median) 341 ms, close a trace (slowest) 9.4 s, read one trace back (median) 271 ms. Delta Lake per batch: write one batch (median) 1.3 s, close a trace (slowest) 1.2 s, read one trace back (median) 2.1 s. Delta Lake per trace: write one batch (median) 360 ms, close a trace (slowest) 8.9 s, read one trace back (median) 395 ms. Lance per batch: write one batch (median) 634 ms, close a trace (slowest) 3.9 s, read one trace back (median) 4.3 s. Lance per trace: write one batch (median) 359 ms, close a trace (slowest) 11 s, read one trace back (median) 971 ms. Parquet files on S3: write one batch (median) 342 ms, close a trace (slowest) 331 ms, read one trace back (median) 5.7 s. Vortex files on S3: write one batch (median) 361 ms, close a trace (slowest) 292 ms, read one trace back (median) 2.7 s. The Delta Lake, Lance and Vortex rows ran at the same time on one instance, so their times include contention with each other.</desc>
<text x="16.0" y="28.0" font-size="17" fill="#f0efec" text-anchor="start" font-weight="600">One pipeline flow at 1.25 batches per second</text>
<text x="16.0" y="49.0" font-size="12.5" fill="#c3c2b7" text-anchor="start">Single run each, 16 workers, 5,000 rows per batch, batch data on S3. Shorter bars are faster.</text>
