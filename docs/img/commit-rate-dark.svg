<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-labelledby="chart-title chart-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="chart-title">Acknowledged commits per second, by number of writers</title>
<desc id="chart-desc">Line chart of median acknowledged commits per second against the number of concurrent writers, both on log scales. Postgres (baseline): 8,240 at 1 writer, 81,667 at 64. DuckLake: 189 at 1 writer, 161 at 64. DuckLake, inlining off: 162 at 1 writer, 124 at 64. Iceberg SQL catalog: 7.85 at 1 writer, 5.07 at 64. Lakekeeper: 6.74 at 1 writer, 4.28 at 64. Polaris: 6.46 at 1 writer, 4.08 at 64. S3 Tables, shared table: 1.88 at 1 writer, 1.87 at 64. S3 Tables, table per writer: 1.87 at 1 writer, 49.1 at 64.</desc>
<text x="16.0" y="28.0" font-size="17" fill="#f0efec" text-anchor="start" font-weight="600">Acknowledged commits per second, by number of writers</text>
<text x="16.0" y="49.0" font-size="12.5" fill="#c3c2b7" text-anchor="start">Median of three 60-second runs per point. EC2 c6id.4xlarge, Python clients. Both axes are log scales.</text>
<text x="16.0" y="70.0" font-size="11.5" fill="#c3c2b7" text-anchor="start">commits per second</text>
