[project]
name = "catalog-bench"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.11",
    "duckdb>=2.0.1",
    "psycopg[binary]>=3.3.9",
    "pyiceberg[pyarrow,sql-postgres]>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
