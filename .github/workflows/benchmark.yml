name: Benchmark (smoke, GitHub-hosted runner)

# Manual only. A shared runner is noisy, so this checks that every self-hosted system still
# runs end to end; it is not a source of comparable numbers. The results file is uploaded as
# an artifact and never committed or pushed.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per run
        default: "10"
      writers:
        description: Writer counts, space separated
        default: "1 4 16"

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECONDS_PER_RUN: ${{ inputs.seconds }}
      WRITERS: ${{ inputs.writers }}
      OUT: results/github-runner-${{ github.run_id }}.json
    steps:
      - name: Check inputs
        run: |
          [[ "$SECONDS_PER_RUN" =~ ^[0-9]+$ ]] || { echo "seconds must be a whole number"; exit 1; }
          [[ "$WRITERS" =~ ^[0-9]+(\ [0-9]+)*$ ]] || { echo "writers must be numbers separated by spaces"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: Start services
        run: docker compose up -d --wait
      - name: Run the self-hosted systems
        # No --systems: the default is every system whose required settings are present, which
        # leaves out s3-tables because no AWS settings exist here.
        run: |
          # shellcheck disable=SC2086  # WRITERS is validated above and must split into separate arguments
          uv run python -m bench.run --writers $WRITERS --seconds "$SECONDS_PER_RUN" \
            --environment "GitHub-hosted runner (shared and noisy), ubuntu-latest, $(nproc) CPUs" \
            --out "$OUT"
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
